name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # מפתח חתימה פרטי מ-GitHub Secrets (אם הוגדר). בלעדיו המפתח משתנה בין בנייה לבנייה.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "חתימה עם המפתח הפרטי"
          else
            echo "::warning::אין מפתח ב-Secrets (KEYSTORE_BASE64 / KEYSTORE_PASSWORD) — ה-SHA1 ישתנה בכל בנייה"
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log || {
            # שגיאות קומפילציה כהערות — כדי שיהיה אפשר לקרוא אותן דרך ה-API
            grep -E "^e: |error:" build.log | head -30 | while read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Spotalk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Spotalk-apk
          path: Spotalk.apk

      # גרסה אחרונה תמיד זמינה להורדה מהטלפון בעמוד Releases
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Spotalk.apk \
            --title "Spotalk (build ${{ github.run_number }})" \
            --notes "נבנה אוטומטית מ-${{ github.sha }}" \
            --latest
